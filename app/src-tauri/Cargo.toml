[package]
name = "katan-alysis"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone workspace: the Tauri shell needs system libraries (webkit2gtk,
# gtk) that the data crates in the root workspace must stay free of.
[workspace]

[profile.release]
strip = true
lto = "thin"

[lib]
name = "katan_alysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jfr-model = { path = "../../crates/jfr-model" }
jfr-ingest = { path = "../../crates/jfr-ingest" }
jfr-aggregate = { path = "../../crates/jfr-aggregate" }

[dev-dependencies]
tempfile = "3"

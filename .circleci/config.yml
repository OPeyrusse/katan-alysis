version: 2.1

jobs:
  # Data crates: format, lints, tests. No system dependencies needed.
  rust-test:
    docker:
      - image: cimg/rust:1.94
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
            - cargo-v1-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

  # Tauri shell: needs webkit2gtk/gtk, hence its own job and cache.
  tauri-check:
    docker:
      - image: cimg/rust:1.94
    resource_class: large
    working_directory: ~/project/app/src-tauri
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install Tauri system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
              libayatana-appindicator3-dev librsvg2-dev patchelf
      - restore_cache:
          keys:
            - tauri-v1-{{ checksum "Cargo.lock" }}
            - tauri-v1-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - save_cache:
          key: tauri-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/project/app/src-tauri/target

  ui-test:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app/ui lint
      - run: pnpm -C app/ui typecheck
      - run: pnpm -C app/ui test
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  ui-build:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app/ui build
      - store_artifacts:
          path: app/ui/dist
          destination: ui-dist

workflows:
  ci:
    jobs:
      - rust-test
      - tauri-check
      - ui-test
      - ui-build:
          requires:
            - ui-test

version: 2.1

jobs:
  # Behavioural specification: structural check plus process analysis.
  # The spec is the primary artefact, so it is gated like the code. The
  # checker is pinned and cached as a binary — building it from source
  # takes longer than running it.
  spec-check:
    docker:
      - image: cimg/rust:1.94
    steps:
      - checkout
      - restore_cache:
          keys:
            - allium-cli-v1-3.5.3
      - run:
          name: Install the Allium checker
          command: command -v allium || cargo install allium-cli --version 3.5.3
      - save_cache:
          key: allium-cli-v1-3.5.3
          paths:
            - ~/.cargo/bin/allium
      - run:
          name: Check the specs (errors and process findings are fatal)
          command: ./scripts/check-specs.sh

  # Data crates: format, lints, tests under coverage. No system dependencies
  # needed. The build fails when line coverage drops below 90%, on the
  # workspace total and on every individual file, so one thin module can't
  # hide behind another's high coverage.
  rust-test:
    docker:
      - image: cimg/rust:1.94
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
            - cargo-v1-
      - run:
          name: Install cargo-llvm-cov
          command: |
            rustup component add llvm-tools-preview
            curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
              | tar xzf - -C ~/.cargo/bin
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run:
          name: Tests with coverage gate (fails under 90% line coverage, workspace or per-file)
          command: cargo llvm-cov --workspace --fail-under-lines 90 --fail-under-file-lines 90
      - run:
          name: Per-module HTML coverage report
          command: cargo llvm-cov report --html
          when: always
      - store_artifacts:
          path: target/llvm-cov/html
          destination: coverage
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

  # Tauri shell: needs webkit2gtk/gtk, hence its own job and cache.
  tauri-check:
    docker:
      - image: cimg/rust:1.94
    resource_class: large
    working_directory: ~/project/app/src-tauri
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install Tauri system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
              libayatana-appindicator3-dev librsvg2-dev patchelf
      - restore_cache:
          keys:
            - tauri-v1-{{ checksum "Cargo.lock" }}
            - tauri-v1-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - save_cache:
          key: tauri-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/project/app/src-tauri/target

  ui-test:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app/ui lint
      - run: pnpm -C app/ui typecheck
      - run: pnpm -C app/ui test
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  ui-build:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app/ui build
      - store_artifacts:
          path: app/ui/dist
          destination: ui-dist

  # Full desktop build (Linux only): produces the release binary and the
  # .deb package as build artifacts. Runs on main only — it is the most
  # expensive job of the workflow.
  tauri-build:
    docker:
      - image: cimg/rust:1.94-node
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Tauri system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
              libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - tauri-release-v1-{{ checksum "app/src-tauri/Cargo.lock" }}
            - tauri-release-v1-
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run: pnpm install --frozen-lockfile
      - run:
          name: Build the desktop app (binary + .deb)
          command: pnpm tauri build
      - run:
          name: Collect artifacts
          command: |
            mkdir -p /tmp/tauri-artifacts
            cp app/src-tauri/target/release/katan-alysis /tmp/tauri-artifacts/
            cp app/src-tauri/target/release/bundle/deb/*.deb /tmp/tauri-artifacts/
            ls -lh /tmp/tauri-artifacts
      - store_artifacts:
          path: /tmp/tauri-artifacts
          destination: app
      - save_cache:
          key: tauri-release-v1-{{ checksum "app/src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - app/src-tauri/target

workflows:
  ci:
    jobs:
      # PR-only jobs: all quality gates run on every branch except main.
      - spec-check:
          filters:
            branches:
              ignore: main
      - rust-test:
          filters:
            branches:
              ignore: main
      - tauri-check:
          filters:
            branches:
              ignore: main
      - ui-test:
          filters:
            branches:
              ignore: main
      - ui-build:
          requires:
            - ui-test
          filters:
            branches:
              ignore: main

  packaging:
    jobs:
      # Optional tauri-build on PRs: a manual approval gate lets reviewers
      # trigger the expensive full build without running it automatically.
      - approve-tauri-build:
          type: approval
          filters:
            branches:
              ignore: main
      - tauri-build:
          name: tauri-build-pr
          requires:
            - approve-tauri-build
          filters:
            branches:
              ignore: main

      # On main, run only the full desktop build — quality gates already
      # passed on the PR branch.
      - tauri-build:
          name: tauri-build-main
          filters:
            branches:
              only: main
